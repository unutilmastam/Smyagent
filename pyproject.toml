[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "smy-agent"
version = "0.1.0"
description = "SMY Agent — AI sales agent platform by ITcoDe.Uz"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Bahrullo Nasrulloev (ITcoDe.Uz)" }]
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "a2wsgi>=1.10,<2.0",
    "httpx>=0.27,<1.0",
    "sqlalchemy>=2.0.30,<3.0",
    "alembic>=1.13,<2.0",
    "pymysql>=1.1,<2.0",
    # MySQL 8 default auth (caching_sha2_password) over TCP needs it.
    "cryptography>=43",
    "jinja2>=3.1.4,<4.0",
    "python-multipart>=0.0.18",
    "argon2-cffi>=23.1,<26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
    "pip-audit>=2.7",
    "uvicorn>=0.32",
    "shellcheck-py>=0.10",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["scripts/check_environment.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "RUF001"]
# Russian/Uzbek Cyrillic UI strings are intentional.
"app/web/i18n.py" = ["RUF001"]
"app/domain/persona.py" = ["RUF001"]
"app/domain/proposals.py" = ["RUF001"]
"app/domain/quality_gate.py" = ["RUF001"]
"app/domain/conversation.py" = ["RUF001"]
"app/domain/outreach.py" = ["RUF001"]

[tool.mypy]
python_version = "3.10"
packages = ["app"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["app.domain.*"]
strict = true
