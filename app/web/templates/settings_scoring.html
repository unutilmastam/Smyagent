{% extends "base.html" %}
{% block title %}{{ t('settings.scoring') }} — SMY Agent{% endblock %}
{% block content %}
<p><a href="/leads">← {{ t('leads.title') }}</a></p>
<h1>{{ t('settings.scoring') }}</h1>
{% if saved %}<p class="alert alert-ok" role="status">{{ t('settings.saved') }}</p>{% endif %}
<form method="post" action="/settings/scoring" class="card form-stack">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  {% for c in components %}
  <label for="w_{{ c.value }}">{{ t('comp.' ~ c.value) }} — {{ t('score.weight') }}</label>
  <input id="w_{{ c.value }}" name="w_{{ c.value }}" type="number" min="0" max="10" step="0.5" value="{{ weights[c.value] }}" inputmode="decimal">
  {% endfor %}
  <label for="threshold">{{ t('settings.threshold') }}</label>
  <input id="threshold" name="threshold" type="number" min="0" max="100" value="{{ threshold }}" inputmode="numeric">
  <button type="submit" class="btn-primary">{{ t('settings.save') }}</button>
</form>
{% endblock %}
