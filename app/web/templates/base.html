<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}SMY Agent{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="{% block body_class %}{% endblock %}">
  {% if user %}
  <header class="topbar">
    <span class="brand">SMY Agent</span>
    <span class="state state-{{ global_state|default('ACTIVE')|lower }}" title="Global holat">{{ global_state|default('') }}</span>
  </header>
  {% endif %}
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  {% if user %}
  <nav class="bottom-nav" aria-label="Asosiy menyu">
    <a href="/" {% if request.url.path == '/' %}aria-current="page"{% endif %}>
      <span aria-hidden="true">⌂</span><span>Bosh sahifa</span>
    </a>
    <form method="post" action="/logout">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button type="submit"><span aria-hidden="true">⎋</span><span>Chiqish</span></button>
    </form>
  </nav>
  {% endif %}
</body>
</html>
